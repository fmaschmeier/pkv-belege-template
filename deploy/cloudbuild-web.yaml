# Baut das Image der Web-App in Cloud Build. Die VITE_*-Werte werden beim Bauen in die App
# geschrieben und hier als Substitutionen übergeben (siehe docs/EINRICHTUNG.md, Abschnitt 3).
# Werte mit Kommas brauchen ein anderes Trennzeichen, z. B. --substitutions=^|^_IMAGE=…|_VITE_PERSON_NAMES=A,B
#
#   gcloud builds submit --config deploy/cloudbuild-web.yaml --substitutions=^|^_IMAGE=…|_VITE_API_URL=…|… .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg=VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}
      - --build-arg=VITE_SUPABASE_KEY=${_VITE_SUPABASE_KEY}
      - --build-arg=VITE_API_URL=${_VITE_API_URL}
      - --build-arg=VITE_PERSON_NAMES=${_VITE_PERSON_NAMES}
      - --build-arg=VITE_INSURANCE_NUMBER=${_VITE_INSURANCE_NUMBER}
      - --build-arg=VITE_RECIPIENT_EMAIL=${_VITE_RECIPIENT_EMAIL}
      - --build-arg=VITE_CC_EMAIL=${_VITE_CC_EMAIL}
      - --build-arg=VITE_SENDER_NAME=${_VITE_SENDER_NAME}
      - --build-arg=VITE_SENDER_EMAIL=${_VITE_SENDER_EMAIL}
      - --build-arg=VITE_SENDER_MOBILE=${_VITE_SENDER_MOBILE}
      - web
images: ["${_IMAGE}"]
substitutions:
  _VITE_PERSON_NAMES: ""
  _VITE_INSURANCE_NUMBER: ""
  _VITE_RECIPIENT_EMAIL: ""
  _VITE_CC_EMAIL: ""
  _VITE_SENDER_NAME: ""
  _VITE_SENDER_EMAIL: ""
  _VITE_SENDER_MOBILE: ""
options:
  substitutionOption: ALLOW_LOOSE
